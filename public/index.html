<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoS · Scopus 반출</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f4f6f9; --panel:#fff; --line:#e1e5eb; --ink:#1b2027; --dim:#667085;
    --accent:#1f5fbf; --accent-soft:#eaf1fc;
    --ok:#1a7f4b; --ok-soft:#e8f6ee; --warn:#a05a00; --warn-soft:#fdf3e3;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#13151a; --panel:#1b1e24; --line:#2b3039; --ink:#e6e8ec; --dim:#9aa3b0;
      --accent:#6fa8ff; --accent-soft:#1b2740;
      --ok:#5fd39a; --ok-soft:#16291f; --warn:#e0a955; --warn-soft:#2b2314;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#13151a; --panel:#1b1e24; --line:#2b3039; --ink:#e6e8ec; --dim:#9aa3b0;
    --accent:#6fa8ff; --accent-soft:#1b2740;
    --ok:#5fd39a; --ok-soft:#16291f; --warn:#e0a955; --warn-soft:#2b2314;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header{background:var(--panel);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
  header h1{margin:0;font-size:19px;letter-spacing:-.02em}
  header p{margin:1px 0 0;color:var(--dim);font-size:12.5px}
  .spacer{flex:1}
  .today{color:var(--dim);font-size:12.5px;white-space:nowrap}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:5px 11px;border-radius:99px;cursor:pointer;font-size:12.5px}
  button:hover{border-color:var(--accent);color:var(--accent)}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0 8px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);font:inherit}
  .search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
  .jump{display:flex;gap:6px;flex-wrap:wrap}
  .jump a{font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;white-space:nowrap}
  .jump a:hover{border-color:var(--accent);color:var(--accent)}
  .jump a .n{color:var(--dim);margin-left:4px;font-size:11.5px}

  /* 구역 */
  section.group{margin:18px 0 6px;scroll-margin-top:12px}
  .g-head{display:flex;align-items:baseline;gap:10px;padding:6px 2px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);margin-bottom:12px}
  .g-head h2{margin:0;font-size:16px;letter-spacing:-.01em}
  .g-head .g-desc{color:var(--dim);font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-head .g-count{color:var(--dim);font-size:12px;white-space:nowrap}
  .g-head .caret{color:var(--dim);font-size:11px;transition:transform .15s;display:inline-block;width:12px}
  section.group.collapsed .caret{transform:rotate(-90deg)}
  section.group.collapsed .grid{display:none}
  section.group.collapsed .g-head{margin-bottom:0}
  .g-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:8px}
  /* 카드 전체가 링크라서 ☆ 버튼은 링크 밖에 두고 위에 겹친다 (누를 때 페이지가 넘어가지 않게) */
  .card-wrap{position:relative;display:flex}
  .card-wrap > a.card{flex:1;padding-right:52px}
  .star{position:absolute;top:12px;right:12px;width:34px;height:34px;padding:0;border-radius:50%;display:grid;place-items:center;
    font-size:18px;line-height:1;color:var(--dim);background:var(--panel);border:1px solid transparent}
  .star:hover{border-color:var(--line);color:#e0a100}
  .star.on{color:#e0a100}
  .star:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  a.card{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:18px;color:inherit;text-decoration:none;box-shadow:var(--shadow);
    transition:border-color .15s,transform .15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card-top{display:flex;align-items:center;gap:12px}
  .ico{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;flex:none}
  .card h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
  .card p{margin:0;color:var(--dim);font-size:13px;flex:1}
  .card-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--dim);border:1px solid var(--line)}
  .status{margin-left:auto;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .status.ok{background:var(--ok-soft);color:var(--ok)}
  .status.warn{background:var(--warn-soft);color:var(--warn)}

  /* 자주 쓰는 기능 (☆ 로 고른 것) */
  .recent{margin:18px 0 4px}
  .recent h2{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:650;letter-spacing:.02em}
  .recent-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .mini-wrap{position:relative;display:flex}
  a.mini{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 44px 10px 12px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:border-color .15s}
  a.mini:hover{border-color:var(--accent)}
  a.mini .ico{width:32px;height:32px;border-radius:9px}
  a.mini .t{font-size:13.5px;font-weight:650;line-height:1.3}
  a.mini .g{font-size:11.5px;color:var(--dim)}
  .mini-wrap .star{top:50%;right:8px;transform:translateY(-50%);width:30px;height:30px;font-size:16px}
  .fav-hint{font-size:12.5px;color:var(--dim);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}

  .empty{text-align:center;color:var(--dim);padding:40px 0}
  .howto{border:1px dashed var(--line);border-radius:14px;padding:16px 18px;color:var(--dim);font-size:12.5px;margin:28px 0 40px}
  .howto b{color:var(--ink)}
  .howto code{background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--ink)}
  @media (max-width:560px){ .today{display:none} .grid{grid-template-columns:1fr} .g-head .g-desc{display:none} }
</style>
<script>
  try {
    var t = localStorage.getItem('work-assistant-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
    </div>
    <div>
      <h1>WoS · Scopus 반출</h1>
      <p>필요한 기능을 눌러서 여세요</p>
    </div>
    <span class="spacer"></span>
    <span class="today" id="today"></span>
    <button id="themeBtn" title="화면 테마 전환 (시스템 → 밝게 → 어둡게)">테마</button>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="기능 검색 (예: 누락, EID, 이수율)" autocomplete="off">
    </label>
    <nav class="jump" id="jump" aria-label="구역으로 이동"></nav>
  </div>

  <div class="recent" id="recent">
    <h2>★ 자주 쓰는 기능</h2>
    <div class="recent-row" id="recentRow"></div>
  </div>

  <div id="groups"><div class="empty">불러오는 중…</div></div>

  <div class="howto">
    <b>새 기능 추가하기</b> — <code>features/새기능이름/</code> 폴더에 <code>feature.json</code>(카드 정보, <code>"group"</code>에 구역 이름)과
    <code>public/index.html</code>(화면)을 넣고 서버를 다시 켜면 해당 구역에 카드가 자동으로 생깁니다.
    구역 목록은 <code>features/groups.json</code>. 자세한 방법은 <code>README.md</code> 참고.
  </div>
</main>

<script>
const ICONS = {
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
  tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
};
const COLLAPSE_KEY = 'work-assistant-collapsed'; // 접어 둔 구역 (이 브라우저에만)
let FAVORITES = []; // ☆ 로 고른 기능 id (고른 순서) — 서버 data/favorites.json 에 저장

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const icon = (name, size = 22) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.tool}</svg>`;
const readJson = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || '') || d; } catch (e) { return d; } };
const writeJson = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let GROUPS = [], FEATURES = [];

function starBtn(f) {
  const on = FAVORITES.includes(f.id);
  return `<button type="button" class="star${on ? ' on' : ''}" data-fav="${esc(f.id)}" aria-pressed="${on}"
    title="${on ? '자주 쓰는 기능에서 빼기' : '자주 쓰는 기능에 추가'}" aria-label="${esc(f.title)} ${on ? '자주 쓰는 기능에서 빼기' : '자주 쓰는 기능에 추가'}">${on ? '★' : '☆'}</button>`;
}

function card(f) {
  return `<div class="card-wrap">
    <a class="card" href="${esc(f.href)}">
      <div class="card-top">
        <div class="ico">${icon(f.icon)}</div>
        <h3>${esc(f.title)}</h3>
      </div>
      <p>${esc(f.description)}</p>
      <div class="card-foot">
        ${(f.tags || []).slice(0, 3).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}
        ${f.ready
          ? '<span class="status ok">사용 가능</span>'
          : `<span class="status warn" title=".env 에 ${esc(f.missingEnv.join(', '))} 값을 넣고 서버를 다시 켜세요">.env 설정 필요</span>`}
      </div>
    </a>${starBtn(f)}</div>`;
}

function matches(f, q) {
  if (!q) return true;
  const g = GROUPS.find((x) => x.id === f.group);
  return [f.title, f.description, f.group, g && g.title, ...(f.tags || [])].join(' ').toLowerCase().includes(q);
}

function renderGroups() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const collapsed = new Set(readJson(COLLAPSE_KEY, []));
  const box = document.getElementById('groups');
  const html = GROUPS.map((g) => {
    const list = FEATURES.filter((f) => f.group === g.id && matches(f, q)).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
    if (!list.length) return '';
    // 검색 중에는 접어 둔 구역도 펼쳐서 보여준다
    const isCollapsed = !q && collapsed.has(g.id);
    return `
      <section class="group${isCollapsed ? ' collapsed' : ''}" id="g-${esc(g.id)}" data-group="${esc(g.id)}">
        <div class="g-head" role="button" tabindex="0" aria-expanded="${!isCollapsed}">
          <span class="caret">▼</span>
          <h2>${esc(g.title)}</h2>
          <span class="g-desc">${esc(g.description || '')}</span>
          <span class="g-count">${list.length}개</span>
        </div>
        <div class="grid">${list.map(card).join('')}</div>
      </section>`;
  }).join('');
  box.innerHTML = html || '<div class="empty">조건에 맞는 기능이 없습니다.</div>';
}

function renderJump() {
  document.getElementById('jump').innerHTML = GROUPS.map((g) => {
    const n = FEATURES.filter((f) => f.group === g.id).length;
    return `<a href="#g-${esc(g.id)}" data-group="${esc(g.id)}">${esc(g.title)}<span class="n">${n}</span></a>`;
  }).join('');
}

function renderFavorites() {
  const list = FAVORITES.map((id) => FEATURES.find((f) => f.id === id)).filter(Boolean);
  const row = document.getElementById('recentRow');
  if (!list.length) {
    row.innerHTML = '<div class="fav-hint">아래 카드 오른쪽 위의 ☆ 를 누르면 여기에 고정됩니다. 자주 여는 기능을 골라 두세요.</div>';
    return;
  }
  row.innerHTML = list.map((f) => {
    const g = GROUPS.find((x) => x.id === f.group);
    return `<div class="mini-wrap"><a class="mini" href="${esc(f.href)}"><div class="ico">${icon(f.icon, 18)}</div>
      <div><div class="t">${esc(f.title)}</div><div class="g">${esc(g ? g.title : f.group)}</div></div></a>${starBtn(f)}</div>`;
  }).join('');
}

async function toggleFavorite(id) {
  const next = FAVORITES.includes(id) ? FAVORITES.filter((x) => x !== id) : [...FAVORITES, id];
  FAVORITES = next; // 먼저 화면에 반영하고 저장
  renderFavorites(); renderGroups();
  try {
    FAVORITES = await fetch('/api/favorites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) }).then((r) => r.json());
  } catch (e) {
    alert('자주 쓰는 기능을 저장하지 못했습니다. 서버가 켜져 있는지 확인하세요.');
  }
  renderFavorites(); renderGroups();
}

// ☆ 버튼 (구역 카드·고정 목록 모두)
document.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-fav]');
  if (!b) return;
  e.preventDefault();
  toggleFavorite(b.dataset.fav);
});

function toggleGroup(sec) {
  const id = sec.dataset.group;
  const set = new Set(readJson(COLLAPSE_KEY, []));
  const nowCollapsed = !sec.classList.contains('collapsed');
  sec.classList.toggle('collapsed', nowCollapsed);
  sec.querySelector('.g-head').setAttribute('aria-expanded', String(!nowCollapsed));
  if (nowCollapsed) set.add(id); else set.delete(id);
  writeJson(COLLAPSE_KEY, [...set]);
}

document.getElementById('groups').addEventListener('click', (e) => {
  if (e.target.closest('button[data-fav]')) return;
  const head = e.target.closest('.g-head');
  if (head && !document.getElementById('q').value.trim()) toggleGroup(head.closest('section.group'));
});
document.getElementById('groups').addEventListener('keydown', (e) => {
  const head = e.target.closest('.g-head');
  if (head && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleGroup(head.closest('section.group')); }
});
// 구역 이동 칩: 접혀 있으면 펼친 뒤 이동
document.getElementById('jump').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-group]'); if (!a) return;
  const sec = document.getElementById('g-' + a.dataset.group);
  if (sec && sec.classList.contains('collapsed')) toggleGroup(sec);
});
document.getElementById('q').addEventListener('input', renderGroups);

Promise.all([
  fetch('/api/features').then((r) => r.json()),
  fetch('/api/favorites').then((r) => r.json()).catch(() => []),
]).then(([data, favs]) => {
  GROUPS = data.groups || [];
  FEATURES = data.features || [];
  FAVORITES = Array.isArray(favs) ? favs : [];
  renderJump(); renderFavorites(); renderGroups();
}).catch(() => {
  document.getElementById('groups').innerHTML = '<div class="empty">기능 목록을 불러오지 못했습니다. 서버가 켜져 있는지 확인하세요.</div>';
});

const d = new Date();
document.getElementById('today').textContent =
  d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

// 테마: 시스템 → 밝게 → 어둡게
const THEMES = [{ v: 'system', label: '테마: 시스템' }, { v: 'light', label: '테마: 밝게' }, { v: 'dark', label: '테마: 어둡게' }];
function getTheme() { try { const t = localStorage.getItem('work-assistant-theme'); return THEMES.some((x) => x.v === t) ? t : 'system'; } catch (e) { return 'system'; } }
function applyTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = THEMES.find((x) => x.v === t).label;
}
document.getElementById('themeBtn').onclick = () => {
  const i = THEMES.findIndex((x) => x.v === getTheme());
  const next = THEMES[(i + 1) % THEMES.length].v;
  try { localStorage.setItem('work-assistant-theme', next); } catch (e) {}
  applyTheme(next);
};
applyTheme(getTheme());
</script>
</body>
</html>
